name: CI

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Lint and integration tests
        runs-on: ubuntu-latest
        timeout-minutes: 10

        services:
            mongodb:
                image: mongo:8.0
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            APP_ENV: test
            PORT: 3000
            TEST_DB_URL: mongodb://127.0.0.1:27017/
            TEST_DB_NAME: url-shortner-ci-${{ github.run_id }}-${{ github.run_attempt }}
            TEST_DB_ACCOUNT: github-actions
            TEST_JWT_SECRET_KEY: github-actions-disposable-test-secret

        steps:
            - name: Check out repository
              uses: actions/checkout@v5

            - name: Set up pnpm
              uses: pnpm/action-setup@v5
              with:
                  version: 10
                  run_install: false

            - name: Set up Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run lint
              run: pnpm lint

            - name: Run MongoDB integration tests
              run: pnpm test
